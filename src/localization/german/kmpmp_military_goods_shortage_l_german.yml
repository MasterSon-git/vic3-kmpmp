 # Read-only Journal Entry status and price conditions
 kmpmp_je_military_goods_shortage_reason: "Zusätzliche KMPMP-Militärwarenmodifikatoren richten sich nach dem [concept_market_price] im Verhältnis zum [concept_base_price], nicht nach der normalen Berechnung von [Concept('concept_shortage', '$concept_input_goods_shortages|q$')]. Sie gelten für verpflichtete Teilnehmer an [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')].\n\n$kmpmp_shortage_weekly$\n\n#b Aktuelle Preisbedingungen#! (über dem Grundpreis):\n$kmpmp_shortage_current_prices$\n\n$radios$ und $aeroplanes$ haben keine leichte Stufe. Sobald das Land kein verpflichteter Teilnehmer mehr ist, wird dieser Journaleintrag samt seinen Modifikatoren entfernt, ohne Abschlussmeldung."
 kmpmp_shortage_weekly: "Die angewendeten Stufen werden am ersten Tag jeder Woche neu berechnet. Aktuelle Preise können bereits eine andere Stufe ergeben; Modifikatoren ändern sich erst bei der nächsten wöchentlichen Prüfung."
 kmpmp_shortage_status_none: "Derzeit wird keine zusätzliche KMPMP-Militärwarenstrafe angewendet.\n$kmpmp_shortage_weekly$"
 kmpmp_shortage_status_active: "#b Angewendete Militärwarenmodifikatoren#![JournalEntry.GetCustom('kmpmp_shortage_applied_small_arms')][JournalEntry.GetCustom('kmpmp_shortage_applied_ammunition')][JournalEntry.GetCustom('kmpmp_shortage_applied_artillery')][JournalEntry.GetCustom('kmpmp_shortage_applied_radios')][JournalEntry.GetCustom('kmpmp_shortage_applied_tanks')][JournalEntry.GetCustom('kmpmp_shortage_applied_aeroplanes')]\nFür Auswirkungen und Stufengrenzen mit der Maus über eine Stufe fahren. Wöchentliche Neuberechnung."
 kmpmp_shortage_current_prices: "@small_arms! $small_arms$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_small_arms')]\n@ammunition! $ammunition$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_ammunition')]\n@artillery! $artillery$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_artillery')]\n@radios! $radios$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_radios')]\n@tanks! $tanks$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_tanks')]\n@aeroplanes! $aeroplanes$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_aeroplanes')]"
 kmpmp_shortage_price_low: "Leicht: +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0] bis unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]"
 kmpmp_shortage_price_medium: "Mittel: +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0] bis unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]"
 kmpmp_shortage_price_high: "Hoch: mindestens +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]"
 kmpmp_shortage_price_below_low: "Unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]: keine Preisstufe"
 kmpmp_shortage_price_below_medium: "Unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]: keine Preisstufe"
 kmpmp_shortage_price_unavailable: "Keine Marktpreisdaten verfügbar"
 kmpmp_shortage_change_low: "Entfällt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]; steigt ab +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]."
 kmpmp_shortage_change_medium_low: "Sinkt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]; entfällt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]; steigt ab +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]."
 kmpmp_shortage_change_medium_no_low: "Entfällt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]; steigt ab +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]. Keine leichte Stufe."
 kmpmp_shortage_change_high_low: "Sinkt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]; entfällt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]."
 kmpmp_shortage_change_high_no_low: "Sinkt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]; entfällt unter +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]."
