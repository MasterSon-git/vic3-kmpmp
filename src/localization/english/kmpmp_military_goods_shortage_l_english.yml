l_english:
 kmpmp_je_military_goods_shortage: "$concept_military_goods$ $concept_shortages$"


 # Small Arms
 kmpmp_shortage_of_small_arms: "$small_arms$ [Concept('concept_shortage', '$concept_input_goods_shortage|q$')]"
 kmpmp_shortage_of_small_arms_low: "#yellow Low#! $kmpmp_shortage_of_small_arms$"
 kmpmp_shortage_of_small_arms_medium: "#orange Medium#! $kmpmp_shortage_of_small_arms$"
 kmpmp_shortage_of_small_arms_high: "#red High#! $kmpmp_shortage_of_small_arms$"

 # Ammo
 kmpmp_shortage_of_ammo: "$ammunition$ [Concept('concept_shortage', '$concept_input_goods_shortage|q$')]"
 kmpmp_shortage_of_ammo_low: "#yellow Low#! $kmpmp_shortage_of_ammo$"
 kmpmp_shortage_of_ammo_medium: "#orange Medium#! $kmpmp_shortage_of_ammo$"
 kmpmp_shortage_of_ammo_high: "#red High#! $kmpmp_shortage_of_ammo$"

