 kmpmp_shortage_of_airplanes_high:  "#red High#! $kmpmp_shortage_of_airplanes$"

 # Read-only Journal Entry status and price conditions
 kmpmp_je_military_goods_shortage_reason: "Additional KMPMP military-goods modifiers use [concept_market_price] relative to [concept_base_price], rather than the normal [Concept('concept_shortage', '$concept_input_goods_shortage|q$')] calculation. They apply to committed [concept_diplomatic_play] participants.\n\n$kmpmp_shortage_weekly$\n\n#b Current price conditions#! (above base price):\n$kmpmp_shortage_current_prices$\n\n$radios$ and $aeroplanes$ have no low tier. When the country is no longer a committed participant, this Journal Entry and its modifiers are removed without a completion message."
 kmpmp_shortage_weekly: "Applied tiers are recalculated on the first day of each week. Current prices may already qualify for a different tier; modifiers change at the next weekly evaluation."
 kmpmp_shortage_status_none: "No additional KMPMP military-goods penalty is currently applied.\n$kmpmp_shortage_weekly$"
 kmpmp_shortage_status_active: "#b Applied military-goods modifiers#![JournalEntry.GetCustom('kmpmp_shortage_applied_small_arms')][JournalEntry.GetCustom('kmpmp_shortage_applied_ammunition')][JournalEntry.GetCustom('kmpmp_shortage_applied_artillery')][JournalEntry.GetCustom('kmpmp_shortage_applied_radios')][JournalEntry.GetCustom('kmpmp_shortage_applied_tanks')][JournalEntry.GetCustom('kmpmp_shortage_applied_aeroplanes')]\nHover a tier for effects and change thresholds. Recalculated weekly."
 kmpmp_shortage_current_prices: "@small_arms! $small_arms$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_small_arms')]\n@ammunition! $ammunition$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_ammunition')]\n@artillery! $artillery$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_artillery')]\n@radios! $radios$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_radios')]\n@tanks! $tanks$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_tanks')]\n@aeroplanes! $aeroplanes$: [JournalEntry.GetCountry.GetCustom('kmpmp_shortage_price_aeroplanes')]"
 kmpmp_shortage_price_low: "Low: +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0] to below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]"
 kmpmp_shortage_price_medium: "Medium: +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0] to below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]"
 kmpmp_shortage_price_high: "High: at least +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]"
 kmpmp_shortage_price_below_low: "Below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]: no price tier"
 kmpmp_shortage_price_below_medium: "Below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]: no price tier"
 kmpmp_shortage_price_unavailable: "Market price data unavailable"
 kmpmp_shortage_change_low: "Removed below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]; increases at +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]."
 kmpmp_shortage_change_medium_low: "Decreases below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]; removed below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]; increases at +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]."
 kmpmp_shortage_change_medium_no_low: "Removed below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]; increases at +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]. No low tier."
 kmpmp_shortage_change_high_low: "Decreases below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]; removed below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_low')|%0]."
 kmpmp_shortage_change_high_no_low: "Decreases below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_high')|%0]; removed below +[SCOPE.ScriptValue('kmpmp_military_goods_shortage_value_medium')|%0]."
 kmpmp_shortage_aeroplanes_no_effect: "This modifier currently has no gameplay effects."
 kmpmp_shortage_row_small_arms_low: "\n#tooltippable #tooltip:[JournalEntry.GetTooltipTag],kmpmp_shortage_of_small_arms_low_tooltip $kmpmp_shortage_of_small_arms_low$#!#!"
