name: Game-version compatibility
description: Report a failure after a Victoria 3 version change.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: "Check existing compatibility issues and PRs first. Add evidence to the existing report when appropriate."
  - type: input
    id: game
    attributes:
      label: Affected Victoria 3 version and checksum
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: KMPMP build and playset
      description: "Include the KMPMP commit or Workshop update, variant (production, test or single-player), enabled DLC, and other mods and their load order."
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure and reproduction
      description: "Describe the expected and actual behaviour, country and in-game date, whether the save is new or older, steps to reproduce, and last working version if known."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (optional)
      description: "Include relevant logs, a save, changed vanilla paths or script documentation if available. Only mention tests you actually performed; remove private information."
