name: Feature request
description: Propose a focused improvement for multiplayer games.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: "Describe a concrete situation in a multiplayer campaign."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: "Explain the desired outcome; implementation details are optional."
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Balance, compatibility or alternatives (optional)
      description: "Mention save compatibility, DLC requirements or similar features in other mods. For proposed third-party content, link the original project and include its author and known license terms."
