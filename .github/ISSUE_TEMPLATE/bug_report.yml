name: Bug report
description: Report a reproducible KMPMP problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Search existing reports first. Share what you know; you can add logs or a save later."
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Include the country, in-game date, and how much in-game time passes before the problem appears. Mention if it only happens in multiplayer."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Game and mod setup
      description: "Include game version/checksum, KMPMP commit or Workshop update, mod variant, DLC, other mods and their load order, and operating system. Unknown details are fine."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Save, logs or screenshots (optional)
      description: "A save just before the problem helps. Copy relevant error.log/game.log before relaunching and remove private information."
